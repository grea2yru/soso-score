name: SoSoScore
options:
  bundleIdPrefix: com.yru
  developmentLanguage: ko
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
packages:
  GestureCore:
    path: Packages/GestureCore
  ScoreFollowCore:
    path: Packages/ScoreFollowCore
targets:
  SoSoScore:
    type: application
    platform: iOS
    sources:
      - App
      - path: Samples
        buildPhase: resources
        excludes: ["LICENSE.md", "tools"]
      - path: Vendor/verovio
        type: folder
        buildPhase: resources
    dependencies:
      - package: GestureCore
      - package: ScoreFollowCore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: SoSo Score
        NSCameraUsageDescription: 얼굴 제스처(고개 돌리기·윙크)로 악보 페이지를 넘기기 위해 전면 카메라를 사용합니다.
        NSMicrophoneUsageDescription: 연주 소리를 듣고 악보의 현재 위치를 따라가기 위해 마이크를 사용합니다.
        UILaunchScreen: {}
        LSSupportsOpeningDocumentsInPlace: false
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleDocumentTypes:
          - CFBundleTypeName: PDF Document
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.adobe.pdf]
          - CFBundleTypeName: MusicXML Score
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.yru.musicxml, com.yru.mxl, public.xml]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.yru.musicxml
            UTTypeDescription: MusicXML Score
            UTTypeConformsTo: [public.xml]
            UTTypeTagSpecification:
              public.filename-extension: [musicxml]
              public.mime-type: [application/vnd.recordare.musicxml+xml]
          - UTTypeIdentifier: com.yru.mxl
            UTTypeDescription: Compressed MusicXML Score
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [mxl]
              public.mime-type: [application/vnd.recordare.musicxml]
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "2"
        SWIFT_VERSION: "5.9"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # String Catalog 추출을 컴파일러가 수행 — Button/Section/Label 등 LocalizedStringKey 문구와
        # String(localized:)·String.LocalizationValue 문구까지 인식 (기본 regex 추출은 Text("…")만 잡음)
        SWIFT_EMIT_LOC_STRINGS: YES
        # 실기기 배포 시 Xcode에서 팀을 지정하거나 아래 주석을 해제해 팀 ID를 기입
        # DEVELOPMENT_TEAM: XXXXXXXXXX
  SoSoScoreTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AppTests]
    dependencies:
      - target: SoSoScore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  SoSoScore:
    build:
      targets:
        SoSoScore: all
        SoSoScoreTests: [test]
    test:
      targets: [SoSoScoreTests]
